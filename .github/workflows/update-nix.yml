name: Update Nix Package

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (no 'v' prefix)"
        required: true
        type: string
      ref:
        description: "Git ref to checkout"
        required: true
        type: string
    outputs:
      updated_sha:
        value: ${{ jobs.update-nix.outputs.updated_sha }}

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.0.0, no 'v' prefix)"
        required: true
        type: string
      ref:
        description: "Git ref to checkout (commit SHA or branch; defaults to current branch)"
        required: false
        default: ""
        type: string

jobs:
  update-nix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated_sha: ${{ steps.push.outputs.updated_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update Nix package version
        run: |
          VERSION="${{ inputs.version }}"
          echo "Updating nix package: version=${VERSION}"

          sed -i "s/version = \"[^\"]*\";/version = \"${VERSION}\";/" packages/nix/millennium.nix

      - name: Regenerate Bun dependency lock
        run: |
          nix run github:nix-community/bun2nix -- \
            --lock-file src/typescript/bun.lock \
            --output-file packages/nix/bun.nix \
            --copy-prefix './../../src/typescript/'
            
          git diff --stat -- packages/nix/bun.nix

      - name: Commit and push nix changes
        id: push
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add packages/nix/millennium.nix packages/nix/bun.nix
          git commit -m "chore(nix): update nix package for release v${{ inputs.version }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
          echo "updated_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
